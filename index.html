<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>

    <!-- CDN Link for Confetti -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.6.0/confetti.browser.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css"> 

    <!-- Favicon/Icon -->
    <link rel="icon" href="images/teddy-bear.png" type="image/png">
</head>
<body>
    <div class="hearts"></div>

    <div class="container">
        <!-- Step 1 -->
        <div class="step active" id="step1">
            <img src="images/step2.gif" alt="Cute Bear" class="bear-img">
            <h1>Helloooooooo, Would You Be My Valentine hehe? :&gt;&gt;</h1>
            <div class="buttons">
                <button class="btn btn-yes" onclick="goToStep2()">Yes</button>
                <button class="btn btn-no" onmouseover="moveButton(this)" onclick="moveButton(this)">No</button>
            </div>
        </div>

        <!-- Step 2 -->
        <div class="step" id="step2">
            <img src="images/dudu-twisting-dance.gif" alt="Cute Bear with Hearts" class="bear-img">
            <h1>R you sure you want to be my Valentine? 💕</h1>
            <div class="buttons">
                <button class="btn btn-yes" onclick="goToStep3()">Yes, 100% Sure</button>
                <button class="btn btn-no" onmouseover="moveButton(this)" onclick="moveButton(this)">Let me think...</button>
            </div>
        </div>

        <!-- Final Message -->
        <div class="final-message">
            <img src="images/stafford-matt-unscreen.gif" alt="Cute Bear in Love" class="bear-img">
            <p>Yeayyyyy, you made valentine this time so special for me, I Love You So Much! 🥰</p>
           
        </div>
        
             
    </div>

    <!-- Script JS -->
    <script src="js/script.js"></script>
</body>
</html>
