<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <!-- CDN Link for confetti -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.6.0/confetti.browser.min.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css"> 
    <!-- Icon -->
    <link rel="icon" href="images/teddy-bear.png" type="image/png">
</head>
<body>
    <!-- Background floating hearts -->
    <div class="hearts"></div>

    <div class="container">
        <!-- Step 1 -->
        <div class="step active" id="step1">
            <img src="images/step2.gif" alt="Cute Bear" class="bear-img">
            <h1>Helloooooooo, Would You Be My Valentine hehe? 💝</h1>
            <div class="buttons">
                <button class="btn btn-yes" onclick="goToStep2()">Yes</button>
                <button class="btn btn-no" onmouseover="moveButton(this)" onclick="moveButton(this)">No</button>
            </div>
        </div>

        <!-- Step 2 -->
        <div class="step" id="step2">
            <img src="images/dudu-twisting-dance.gif" alt="Cute Bear with Hearts" class="bear-img">
            <h1>Sure na ba yan?💕</h1>
            <div class="buttons">
                <button class="btn btn-yes" onclick="goToStep3()">Yes, 100% Sure</button>
                <button class="btn btn-no" onmouseover="moveButton(this)" onclick="moveButton(this)">Let me think...</button>
            </div>
        </div>

        <!-- Step 3 -->
        <div class="step" id="step3">
            <img src="images/step22.gif" alt="Cute Bear in Love" class="bear-img">
            <h1>Wala pa kasi ako, Pwede bang ikaw nalang :>? ❤️</h1>
            <div class="buttons">
                <button class="btn btn-yes" onclick="finalStep()">Yes, Sure Baby</button>
            </div>
        </div>

        <!-- Final Message -->
        <div class="final-message">
            <img src="images/stafford-matt-unscreen.gif" alt="Cute Bear in Love" class="bear-img">
            <p>Yeayyyyy, may kadate na me :>> </p>
            <p style="margin-top: 15px;">G habol sa 14 hehe 💌</p>

            <!-- Final buttons container -->
            <div class="final-buttons">
                <a href="https://wa.me/639942370974?text=Heyyy%20,%20its%20me,%20your%20valentine%20%E2%9D%A4%EF%B8%8F" class="whatsapp-btn" target="_blank">
                    Text me here 💌
                </a>
                <a href="https://www.facebook.com/harveycanales.13" class="facebook-btn" target="_blank">
                    Visit me on Facebook 📘
                </a>
            </div>
        </div>
    </div>

    <!-- Script JS -->
    <script src="js/script.js"></script>
</body>
</html>
